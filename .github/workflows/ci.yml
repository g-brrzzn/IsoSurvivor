name: Build + Release IsometricGame

on:
  push:
    branches: [ main ]
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Build MonoGame content
        run: dotnet tool run mgcb "/@:IsometricGame/Content/Content.mgcb" /platform:DesktopGL

      - name: Restore NuGet
        run: dotnet restore

      - name: Build
        run: dotnet build IsometricGame/IsometricGame.csproj -c Release

      - name: Publish Linux
        if: runner.os == 'Linux'
        run: |
          dotnet publish IsometricGame/IsometricGame.csproj \
          -c Release \
          -r linux-x64 \
          --self-contained false \
          -o publish/linux

      - name: Publish Windows
        if: runner.os == 'Windows'
        run: |
          dotnet publish IsometricGame/IsometricGame.csproj `
          -c Release `
          -r win-x64 `
          --self-contained false `
          -o publish/windows

      - name: Package builds
        run: |
          cd publish
          if [ -d linux ]; then zip -r IsometricGame-linux.zip linux; fi
          if [ -d windows ]; then zip -r IsometricGame-windows.zip windows; fi
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: publish/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            **/*.zip
